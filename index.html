:root {
--bg: #0b0b0b;
--surface: #111119;
--surface-2: #16161f;
--border: #23232e;
--border-strong: #30303c;
--text: #f4f4f7;
--text-2: #9a9aa6;
--text-3: #7c7c88;
--lima: #b8ff00;
--lima-apagado: #86bd00;
--accent: #b8ff00;
--grad-brand: linear-gradient(120deg, #b8ff00, #8fe000);
--grad-text: linear-gradient(100deg, #b8ff00, #e4ff8f 55%, #b8ff00);
--font-head: "Space Grotesk", "Space Grotesk fallback", system-ui, sans-serif;
--font-body: "Inter", "Inter fallback", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
overflow-x: clip;
background: var(--bg);
color: var(--text);
font-family: var(--font-body);
font-size: 16px;
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
-webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.grad-text {
background: var(--grad-text);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
}
.glow {
position: fixed;
top: -18%;
left: 50%;
transform: translateX(-50%);
width: min(1000px, 120vw);
height: 640px;
background: radial-gradient(closest-side, rgba(184, 255, 0, 0.16), rgba(184, 255, 0, 0.05), transparent);
pointer-events: none;
z-index: 0;
}
.site-header {
position: sticky; top: 14px;
z-index: 50;
display: flex;
align-items: center;
justify-content: space-between;
gap: 16px;
width: calc(100% - 32px);
max-width: 880px;
margin: 14px auto 0;
padding: 6px 6px 6px 16px;
background: rgba(14, 14, 14, 0.42);
backdrop-filter: blur(14px) saturate(140%);
-webkit-backdrop-filter: blur(14px) saturate(140%);
border: 1px solid rgba(255, 255, 255, 0.07);
border-radius: 999px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon { height: 22px; width: auto; display: block; }
.brand-name {
font-family: var(--font-head);
font-weight: 600;
font-size: 15px;
line-height: 1;
letter-spacing: -0.01em;
color: #fff;
}
.site-nav { display: flex; gap: 2px; font-size: 13px; letter-spacing: 0.01em; color: var(--text-2); }
.site-nav a { padding: 6px 13px; border-radius: 999px; transition: color 0.15s ease, background 0.15s ease; }
.site-nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
.site-nav a.active { color: var(--text); }
.btn {
position: relative;
overflow: hidden;
display: inline-flex;
align-items: center;
gap: 6px;
font-size: 14px;
font-weight: 500;
letter-spacing: 0.01em;
padding: 11px 20px;
border-radius: 999px;
transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.25s ease;
}
.btn::after {
content: "";
position: absolute;
top: 0;
left: -75%;
width: 60%;
height: 100%;
background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
transform: skewX(-20deg);
pointer-events: none;
}
.btn:hover::after { animation: btn-shine 0.7s ease; }
@keyframes btn-shine {
from { left: -75%; }
to { left: 130%; }
}
.btn-primary { background: var(--lima); color: #0b0b0b; font-weight: 600; }
.btn-primary:hover { box-shadow: 0 6px 30px rgba(184, 255, 0, 0.34); }
.btn-ghost {
border: 1px solid rgba(255, 255, 255, 0.16);
background: rgba(11, 11, 11, 0.32);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
color: var(--text);
}
.btn-ghost:hover { border-color: rgba(184, 255, 0, 0.45); background: rgba(184, 255, 0, 0.06); }
@media (prefers-reduced-motion: reduce) {
.btn:hover::after { animation: none; }
}
.work {
position: relative;
z-index: 1;
flex: 1;
width: 100%;
max-width: 1120px;
margin: 0 auto;
padding: 0 32px 40px;
}
.work-etiqueta {
display: inline-flex;
align-items: center;
gap: 10px;
margin-bottom: 26px;
padding: 7px 14px 7px 12px;
font-size: 12px;
font-weight: 500;
letter-spacing: 0.04em;
color: var(--text-2);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 999px;
background: rgba(255, 255, 255, 0.025);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
}
.punto {
width: 6px;
height: 6px;
border-radius: 50%;
background: var(--lima);
box-shadow: 0 0 10px rgba(184, 255, 0, 0.8);
animation: latido 2.4s ease-in-out infinite;
}
@keyframes latido { 50% { opacity: 0.45; box-shadow: 0 0 4px rgba(184, 255, 0, 0.4); } }
.work-hero {
position: relative;
isolation: isolate;
padding: 120px 0 72px;
text-align: center;
}
.work-aura {
position: absolute;
z-index: -1;
left: 50%;
top: -120px;
width: 100vw;
height: 720px;
transform: translateX(-50%);
overflow: hidden;
pointer-events: none;
}
.work-aura span {
position: absolute;
border-radius: 50%;
filter: blur(90px);
}
.work-aura span:first-child {
left: 50%;
top: 40px;
width: 760px;
height: 420px;
margin-left: -380px;
background: radial-gradient(closest-side, rgba(184, 255, 0, 0.16), transparent);
animation: aura 18s ease-in-out infinite;
}
.work-aura span:last-child {
left: 50%;
top: 160px;
width: 520px;
height: 320px;
margin-left: -60px;
background: radial-gradient(closest-side, rgba(228, 255, 143, 0.07), transparent);
animation: aura 24s ease-in-out -6s infinite reverse;
}
@keyframes aura {
50% { transform: translate(60px, 30px) scale(1.08); }
}
.work-title {
max-width: 15ch;
margin: 0 auto;
font-family: var(--font-head);
font-weight: 500;
font-size: clamp(38px, 5.6vw, 76px);
line-height: 1.06;
letter-spacing: -0.035em;
color: #fff;
}
.work-title .w {
display: inline-block;
opacity: 0;
transform: translateY(14px);
filter: blur(8px);
animation: palabra 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.work-title .w:nth-child(1) { animation-delay: 0.1s; }
.work-title .w:nth-child(2) { animation-delay: 0.18s; }
.work-title .w:nth-child(3) { animation-delay: 0.26s; }
.work-title .w:nth-child(4) { animation-delay: 0.34s; }
.work-title .w:nth-child(5) { animation-delay: 0.46s; }
.work-title .w:nth-child(6) { animation-delay: 0.56s; }
@keyframes palabra { to { opacity: 1; transform: none; filter: none; } }
.work-title .brillo {
background: linear-gradient(100deg, #f4f4f7 0%, #d9ff7a 30%, #b8ff00 50%, #e9ffb8 70%, #f4f4f7 100%);
background-size: 220% 100%;
-webkit-background-clip: text;
background-clip: text;
color: transparent;
animation: palabra 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards, brillo 9s ease-in-out 1.6s infinite;
}
.work-title .brillo:nth-child(5) { animation-delay: 0.46s, 1.6s; }
.work-title .brillo:nth-child(6) { animation-delay: 0.56s, 1.6s; }
@keyframes brillo { 50% { background-position: 100% 0; } }
.work-sub,
.work-datos,
.work-bajar { opacity: 0; animation: palabra 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards; }
.work-sub {
max-width: 46ch;
margin: 26px auto 0;
font-size: 17px;
line-height: 1.65;
color: var(--text-2);
}
.work-datos {
display: inline-flex;
align-items: center;
gap: 18px;
margin-top: 30px;
font-size: 13px;
letter-spacing: 0.02em;
color: var(--text-3);
}
.work-datos strong { font-weight: 500; color: var(--text); }
.work-datos i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); }
.work-bajar {
position: relative;
display: block;
width: 1px;
height: 56px;
margin: 56px auto 0;
background: linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0));
}
.work-bajar span {
position: absolute;
left: -2px;
top: 0;
width: 5px;
height: 5px;
border-radius: 50%;
background: var(--lima);
box-shadow: 0 0 10px rgba(184, 255, 0, 0.8);
animation: bajar 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}
@keyframes bajar {
0% { transform: translateY(0); opacity: 0; }
15% { opacity: 1; }
80% { opacity: 1; }
100% { transform: translateY(52px); opacity: 0; }
}
.cinta {
position: relative;
left: 50%;
width: 100vw;
margin: 24px 0 128px;
transform: translateX(-50%);
overflow: hidden;
padding: 22px 0;
border-top: 1px solid rgba(255, 255, 255, 0.06);
border-bottom: 1px solid rgba(255, 255, 255, 0.06);
-webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
}
.cinta-pista { display: flex; width: max-content; animation: cinta 70s linear infinite; }
.cinta-tira {
display: flex;
align-items: center;
gap: 44px;
padding-right: 44px;
font-family: var(--font-head);
font-size: 13px;
font-weight: 500;
letter-spacing: 0.32em;
text-transform: uppercase;
white-space: nowrap;
color: var(--text-3);
}
.cinta-tira i { font-style: normal; font-size: 9px; color: var(--lima); opacity: 0.7; }
@keyframes cinta { to { transform: translateX(-50%); } }
.vitrina { scroll-margin-top: 90px; }
.vitrina-lista { display: flex; flex-direction: column; gap: 144px; }
.show {
display: grid;
grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
gap: 72px;
align-items: center;
}
.show:nth-child(even) .show-media { order: 2; }
.show-media { position: relative; z-index: 0; display: block; justify-self: center; width: min(360px, 100%); }
.show-media::after {
content: "";
position: absolute;
z-index: -1;
inset: -16px;
border-radius: 50%;
border: 1px solid rgba(255, 255, 255, 0.07);
border-top-color: color-mix(in srgb, var(--acento) 55%, transparent);
transition: border-color 0.8s ease;
animation: aro 24s linear infinite;
}
@keyframes aro { to { transform: rotate(360deg); } }
.show-media::before {
content: "";
position: absolute;
z-index: -1;
inset: -10%;
background: radial-gradient(closest-side, var(--acento), transparent);
opacity: 0.16;
filter: blur(60px);
transition: opacity 0.8s ease;
}
.show-frame {
position: relative;
aspect-ratio: 1;
overflow: hidden;
border-radius: 50%;
background: radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.06), transparent 60%), var(--fondo);
box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 40px 80px -30px rgba(0, 0, 0, 0.7);
transition: box-shadow 0.8s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.show-frame img {
position: absolute;
left: 15%;
top: 15%;
width: 70%;
height: 70%;
border-radius: 50%;
object-fit: cover;
display: block;
box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 50px -18px rgba(0, 0, 0, 0.8);
transform: translate3d(0, calc(var(--py, 0px) * 0.35), 0) scale(1.01);
transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.show-frame::after {
content: "";
position: absolute;
inset: 0;
border-radius: inherit;
background:
radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.10), transparent 50%),
linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 30%);
opacity: 0.35;
transition: opacity 0.6s ease;
pointer-events: none;
}
.show:hover .show-media::before { opacity: 0.3; }
.show:hover .show-media::after { border-color: rgba(255, 255, 255, 0.12); border-top-color: var(--acento); }
.show:hover .show-frame { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 50px 90px -30px rgba(0, 0, 0, 0.8); }
.show:hover .show-frame img { transform: translate3d(0, calc(var(--py, 0px) * 0.35), 0) scale(1.05); }
.show:hover .show-frame::after { opacity: 1; }
.show-meta { display: flex; align-items: center; gap: 14px; }
.show-num {

font-weight: 500;

.show-tag {

.show-soon {

letter-spacing: 0.2em;

.show-name {

.show-name a { transition: color 0.4s ease; }
.show-name a:hover { color: var(--acento); }
.show-desc { max-width: 40ch; font-size: 15.5px; line-height: 1.75; color: var(--text-2); }
.show-plat { display: flex; flex-wrap: wrap; gap: 18px; margin: 22px 0 30px; list-style: none; }
.show-plat li { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-3); }
.show-plat svg { width: 14px; height: 14px; display: block; opacity: 0.85; }
.show-cta {

}
.show-cta span { display: inline-block; color: var(--acento); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.show-cta:hover { background-size: 100% 1px, 100% 1px; }
.show-cta:hover span { transform: translateX(5px); }

  <script id="js:portal.js">
// ----------------------------------------------------------------
// La sala del portal, viva.
//
//  - La luz de la puerta "respira": un brillo que sube y baja muy despacio.
//  - Polvo en el haz: motas de luz que salen de la puerta y flotan.
//  - Parallax: la foto se corre unos pixeles con el puntero (solo con mouse).
//
// Todo se dibuja en un <canvas> encima de la foto y debajo del velo. La puerta
// esta medida sobre los pixeles de las dos fotos (horizontal y vertical) como
// fraccion del ancho y el alto; como la foto va con object-fit: cover, se
// calcula donde cae en pantalla cada vez que cambia el tamano.
// Con "reducir movimiento" no se carga nada.
// ----------------------------------------------------------------
(function () {
  var foto = document.querySelector(".portada-fondo");
  if (!foto) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var lienzo = document.createElement("canvas");
  var ctx = lienzo.getContext && lienzo.getContext("2d");
  if (!ctx) return;
  lienzo.className = "portal-luz";
  lienzo.setAttribute("aria-hidden", "true");
  (foto.closest("picture") || foto).insertAdjacentElement("afterend", lienzo);

  // [izquierda, arriba, derecha, abajo] del vano, en fraccion de la foto
  var PUERTA = { horizontal: [0.643, 0.376, 0.72, 0.734], vertical: [0.391, 0.375, 0.622, 0.737] };
  var conMouse = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  var W = 0, H = 0, dpr = 1, vano = null, motas = [], CANT = 0;
  var objX = 0, objY = 0, desX = 0, desY = 0;

  function medir() {
    W = window.innerWidth;
    H = foto.getBoundingClientRect().height || window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    lienzo.width = Math.round(W * dpr);
    lienzo.height = Math.round(H * dpr);
    lienzo.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var nw = foto.naturalWidth, nh = foto.naturalHeight;
    if (!nw || !nh) { vano = null; return; }
    var escala = Math.max(W / nw, H / nh);
    var rw = nw * escala, rh = nh * escala;
    var pos = getComputedStyle(foto).objectPosition.split(" ");
    var fx = parseFloat(pos[0]); fx = isNaN(fx) ? 0.5 : fx / 100;
    var fy = parseFloat(pos[1]); fy = isNaN(fy) ? 0.5 : fy / 100;
    var x0 = (W - rw) * fx, y0 = (H - rh) * fy;
    var d = nh > nw ? PUERTA.vertical : PUERTA.horizontal;
    vano = { x0: x0 + d[0] * rw, y0: y0 + d[1] * rh, x1: x0 + d[2] * rw, y1: y0 + d[3] * rh };
    vano.cx = (vano.x0 + vano.x1) / 2;
    vano.cy = (vano.y0 + vano.y1) / 2;
    vano.w = vano.x1 - vano.x0;
    vano.h = vano.y1 - vano.y0;
    CANT = W < 700 ? 34 : 64;
    while (motas.length < CANT) motas.push(nueva(true));
    motas.length = CANT;
  }

  function nueva(alAzar) {
    var m = {};
    if (!vano) return m;
    // nacen dentro del vano y salen hacia la sala, abriendose
    m.x = vano.x0 + Math.random() * vano.w;
    m.y = vano.y0 + Math.random() * vano.h;
    m.vx = (m.x - vano.cx) / vano.w * (14 + Math.random() * 22);
    m.vy = -2 - Math.random() * 6;
    m.r = 0.7 + Math.random() * 1.9;
    m.vida = alAzar ? Math.random() : 0;
    m.dura = 7 + Math.random() * 8;
    m.fase = Math.random() * 6.28;
    return m;
  }

  var ultimo = 0, pausa = false;
  function cuadro(t) {
    if (pausa) return;
    requestAnimationFrame(cuadro);
    var dt = ultimo ? Math.min(0.05, (t - ultimo) / 1000) : 0.016;
    ultimo = t;

    // parallax suave hacia el objetivo del puntero
    desX += (objX - desX) * Math.min(1, dt * 3);
    desY += (objY - desY) * Math.min(1, dt * 3);
    var mov = "translate3d(" + desX.toFixed(2) + "px," + desY.toFixed(2) + "px,0) scale(1.03)";
    foto.style.transform = mov;
    lienzo.style.transform = mov;

    ctx.clearRect(0, 0, W, H);
    if (!vano) return;

    // la puerta respira
    var s = t / 1000;
    var pulso = 0.5 + 0.5 * Math.sin(s * 0.9);
    var radio = vano.h * (0.85 + 0.12 * pulso);
    var g = ctx.createRadialGradient(vano.cx, vano.cy, vano.w * 0.2, vano.cx, vano.cy, radio);
    g.addColorStop(0, "rgba(200, 255, 80," + (0.10 + 0.08 * pulso).toFixed(3) + ")");
    g.addColorStop(1, "rgba(184, 255, 0, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(vano.cx - radio, vano.cy - radio, radio * 2, radio * 2);

    // polvo en el haz
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < motas.length; i++) {
      var m = motas[i];
      m.vida += dt / m.dura;
      if (m.vida >= 1 || m.x === undefined) { motas[i] = m = nueva(false); }
      m.x += (m.vx + Math.sin(s * 0.7 + m.fase) * 4) * dt;
      m.y += m.vy * dt;
      var a = Math.sin(Math.PI * m.vida) * (0.6 + 0.3 * Math.sin(s * 2 + m.fase));
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, 6.283);
      ctx.fillStyle = "rgba(225, 255, 160," + Math.max(0, a).toFixed(3) + ")";
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  if (conMouse) {
    window.addEventListener("pointermove", function (e) {
      objX = (e.clientX / W - 0.5) * -16;
      objY = (e.clientY / H - 0.5) * -10;
    }, { passive: true });
  }
  document.addEventListener("visibilitychange", function () {
    pausa = document.hidden;
    if (!pausa) { ultimo = 0; requestAnimationFrame(cuadro); }
  });
  window.addEventListener("resize", medir);

  // Al girar el telefono el <picture> puede cambiar de foto: se vuelve a medir.
  foto.addEventListener("load", medir);
  if (foto.complete && foto.naturalWidth) medir();
  requestAnimationFrame(cuadro);
})();
  </script>
  <script id="js:cometa.js">
// ----------------------------------------------------------------
// El cursor es un cometa.
//
// Una cabeza de luz verde, una estela que se estira con la velocidad y se
// recoge cuando el puntero se frena, y particulas que se desprenden, flotan
// sin gravedad y se apagan titilando. Todo en un <canvas> encima de la pagina.
//
// Detalles que importan:
//  - Solo con puntero fino (mouse o trackpad). En pantallas tactiles no hay
//    nada que seguir.
//  - La clase que esconde el cursor del sistema la pone este script: si no
//    corre, queda la flecha de siempre.
//  - El bucle se detiene solo cuando no queda nada en movimiento, para no
//    gastar bateria con el puntero quieto.
//  - Con "reducir movimiento" no hay estela ni particulas: solo la luz, pegada
//    al puntero.
//  - Las luces se pintan una vez en un sprite y despues solo se copian:
//    shadowBlur por particula es lo que vuelve lento a un efecto asi.
// ----------------------------------------------------------------
(function () {
  var fino = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)");
  if (!fino || !fino.matches) return;

  var lienzo = document.createElement("canvas");
  var ctx = lienzo.getContext && lienzo.getContext("2d");
  if (!ctx) return;
  lienzo.className = "cometa";
  lienzo.setAttribute("aria-hidden", "true");
  document.body.appendChild(lienzo);
  document.body.classList.add("cometa-activo");

  var quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var VIDA_ESTELA = 190;   // ms que tarda un punto de la estela en apagarse
  var MAX_PARTICULAS = 260;

  // ---- sprites de luz ----
  function sprite(centro, medio) {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, centro);
    r.addColorStop(0.22, medio);
    r.addColorStop(1, "rgba(184, 255, 0, 0)");
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  var luz = sprite("rgba(236, 255, 180, 1)", "rgba(184, 255, 0, 0.55)");
  var chispa = sprite("rgba(255, 255, 255, 1)", "rgba(214, 255, 120, 0.6)");

  // ---- estado ----
  var dpr = 1, ancho = 0, alto = 0;
  var px = 0, py = 0;          // puntero
  var cx = 0, cy = 0;          // cabeza del cometa
  var estela = [];             // {x, y, t}
  var particulas = [];
  var sobreEnlace = false;
  var escala = 1;              // tamano animado de la cabeza
  var visible = false;
  var pedido = 0, ultimo = 0;

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    ancho = window.innerWidth;
    alto = window.innerHeight;
    lienzo.width = Math.round(ancho * dpr);
    lienzo.height = Math.round(alto * dpr);
    lienzo.style.width = ancho + "px";
    lienzo.style.height = alto + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pedir();
  }

  function pedir() {
    if (!pedido) pedido = requestAnimationFrame(cuadro);
  }

  function soltar(x, y, vx, vy, vidaMin, vidaMax) {
    if (particulas.length >= MAX_PARTICULAS) particulas.shift();
    particulas.push({
      x: x, y: y, vx: vx, vy: vy,
      vida: 1,
      dura: vidaMin + Math.random() * (vidaMax - vidaMin),
      tam: 0.7 + Math.random() * 1.9,
      blanca: Math.random() < 0.24,
      fase: Math.random() * 6.283,
      titila: 5 + Math.random() * 9
    });
  }

  // Polvo que se desprende a lo largo del tramo recorrido en este cuadro
  function desprender(x0, y0, x1, y1, dist, dt) {
    var ux = (x1 - x0) / dist, uy = (y1 - y0) / dist;
    var rapidez = Math.min(dist / Math.max(dt, 0.001), 2600);
    var cuantas = Math.min(8, dist / 5.5);
    var n = Math.floor(cuantas) + (Math.random() < cuantas % 1 ? 1 : 0);
    for (var i = 0; i < n; i++) {
      var t = Math.random();
      var ang = Math.random() * 6.283;
      var deriva = 10 + Math.random() * 34;
      soltar(
        x0 + (x1 - x0) * t + (Math.random() - 0.5) * 3,
        y0 + (y1 - y0) * t + (Math.random() - 0.5) * 3,
        -ux * rapidez * 0.06 + Math.cos(ang) * deriva,
        -uy * rapidez * 0.06 + Math.sin(ang) * deriva,
        0.55, 1.45
      );
    }
  }

  function cuadro(ahora) {
    pedido = 0;
    var dt = ultimo ? Math.min(0.05, (ahora - ultimo) / 1000) : 1 / 60;
    ultimo = ahora;

    // La cabeza va pegada al puntero: es el cursor, y cualquier arrastre se
    // siente pesado (con 125 ms de demora se sentia). El cometa lo dan la
    // estela y las particulas, que si quedan atras.
    var ox = cx, oy = cy;
    cx = px;
    cy = py;
    var mx = cx - ox, my = cy - oy;
    var dist = Math.sqrt(mx * mx + my * my);

    var objetivo = sobreEnlace ? 1.75 : 1;
    escala += (objetivo - escala) * Math.min(1, dt * 12);

    if (!quieto) {
      if (dist > 0.3 || !estela.length) estela.push({ x: cx, y: cy, t: ahora });
      while (estela.length && ahora - estela[0].t > VIDA_ESTELA) estela.shift();
      if (dist > 0.6) desprender(ox, oy, cx, cy, dist, dt);

      var freno = Math.pow(0.16, dt);   // sin gravedad: solo se frenan
      for (var j = particulas.length - 1; j >= 0; j--) {
        var p = particulas[j];
        p.vida -= dt / p.dura;
        if (p.vida <= 0) { particulas.splice(j, 1); continue; }
        p.vx *= freno;
        p.vy *= freno;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    dibujar(ahora);

    var sigue = visible && !quieto && (
      estela.length > 1 || particulas.length ||
      Math.abs(px - cx) > 0.2 || Math.abs(py - cy) > 0.2 ||
      Math.abs(escala - objetivo) > 0.01
    );
    if (sigue) pedir();
    else ultimo = 0;
  }

  // Catmull-Rom: con el mouse rapido los puntos quedan a 20-30 px y la cinta
  // salia quebrada. Se intercalan puntos intermedios sobre una curva suave.
  function suavizar(pts) {
    if (pts.length < 3) return pts;
    var salida = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (var s = 0; s < 4; s++) {
        var u = s / 4, u2 = u * u, u3 = u2 * u;
        salida.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3)
        });
      }
    }
    salida.push(pts[pts.length - 1]);
    return salida;
  }

  // Una cinta rellena: ancho cero en la cola, anchoMax en la cabeza, con un
  // degradado de color a lo largo.
  function cinta(pts, anchoMax, colorCola, colorCabeza) {
    var n = pts.length;
    var cola = pts[0], cabeza = pts[n - 1];
    var dx = cabeza.x - cola.x, dy = cabeza.y - cola.y;
    if (dx * dx + dy * dy < 1) return;
    var izq = [], der = [];
    for (var i = 0; i < n; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      var tx = b.x - a.x, ty = b.y - a.y;
      var largo = Math.sqrt(tx * tx + ty * ty) || 1;
      var nx = -ty / largo, ny = tx / largo;
      var w = anchoMax * Math.pow(i / (n - 1), 1.5) / 2;
      izq.push(pts[i].x + nx * w, pts[i].y + ny * w);
      der.push(pts[i].x - nx * w, pts[i].y - ny * w);
    }
    ctx.beginPath();
    ctx.moveTo(izq[0], izq[1]);
    for (i = 2; i < izq.length; i += 2) ctx.lineTo(izq[i], izq[i + 1]);
    for (i = der.length - 2; i >= 0; i -= 2) ctx.lineTo(der[i], der[i + 1]);
    ctx.closePath();
    var g = ctx.createLinearGradient(cola.x, cola.y, cabeza.x, cabeza.y);
    g.addColorStop(0, colorCola);
    g.addColorStop(1, colorCabeza);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function estampar(pts) {
    var n = pts.length, total = 0, largos = [0], i;
    for (i = 1; i < n; i++) {
      var ex = pts[i].x - pts[i - 1].x, ey = pts[i].y - pts[i - 1].y;
      total += Math.sqrt(ex * ex + ey * ey);
      largos.push(total);
    }
    if (total < 1) return;
    var j = 1;
    for (var d = 0; d <= total; d += 3) {
      while (j < n - 1 && largos[j] < d) j++;
      var a = pts[j - 1], b = pts[j];
      var u = (d - largos[j - 1]) / ((largos[j] - largos[j - 1]) || 1);
      var x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u;
      var f = d / total;                                 // 0 cola, 1 cabeza
      var r = (2.5 + 19 * Math.pow(f, 1.6)) * escala;
      ctx.globalAlpha = 0.07 * f;
      ctx.drawImage(luz, x - r, y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function dibujar(ahora) {
    ctx.clearRect(0, 0, ancho, alto);
    if (!visible) return;
    ctx.globalCompositeOperation = "lighter";

    // Estela: una cinta continua que se afina hacia la cola. Dibujarla como
    // tramos sueltos con tapa redonda dejaba una hilera de perlas, porque las
    // tapas se superponen y la luz se suma justo ahi.
    if (estela.length > 1) {
      var curva = suavizar(estela);
      // El halo no puede ser una cinta: un poligono ancho tiene bordes duros y
      // queda una cuna, como un reflector. Se estampa luz difusa a lo largo de
      // la curva, que se abre de a poco hacia la cabeza.
      estampar(curva);
      cinta(curva, 4 * escala, "rgba(220, 255, 140, 0)", "rgba(246, 255, 214, 0.9)");
    }

    // Particulas: se achican y titilan mientras se apagan
    var s = ahora / 1000;
    for (var j = 0; j < particulas.length; j++) {
      var p = particulas[j];
      var brillo = 0.6 + 0.4 * Math.sin(s * p.titila + p.fase);
      var r = p.tam * (0.5 + 0.5 * p.vida) * 3.2;
      ctx.globalAlpha = Math.max(0, p.vida * brillo);
      ctx.drawImage(p.blanca ? chispa : luz, p.x - r, p.y - r, r * 2, r * 2);
    }

    // Cabeza: resplandor amplio, coma y punto blanco
    ctx.globalAlpha = 0.32;
    var R = 44 * escala;
    ctx.drawImage(luz, cx - R, cy - R, R * 2, R * 2);
    ctx.globalAlpha = 0.95;
    R = 12 * escala;
    ctx.drawImage(luz, cx - R, cy - R, R * 2, R * 2);
    ctx.globalAlpha = 1;
    R = 4.6 * escala;
    ctx.drawImage(chispa, cx - R, cy - R, R * 2, R * 2);

    // Aro oscuro finito: no se nota sobre la sala, pero es lo que deja ver la
    // cabeza cuando pasa por encima del boton lima.
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 5.2 * escala, 0, 6.283);
    ctx.strokeStyle = "rgba(11, 11, 11, 0.45)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  function tocable(nodo) {
    return !!(nodo && nodo.closest && nodo.closest('a, button, [role="button"], summary'));
  }

  window.addEventListener("pointermove", function (e) {
    if (e.pointerType && e.pointerType !== "mouse") return;
    px = e.clientX;
    py = e.clientY;
    if (!visible) {
      visible = true;
      cx = px;
      cy = py;
      estela.length = 0;
    }
    sobreEnlace = tocable(e.target);
    pedir();
  }, { passive: true });

  // Un click suelta un estallido de polvo hacia todos lados
  window.addEventListener("pointerdown", function (e) {
    if (quieto || (e.pointerType && e.pointerType !== "mouse")) return;
    for (var i = 0; i < 22; i++) {
      var ang = (i / 22) * 6.283 + Math.random() * 0.3;
      var v = 70 + Math.random() * 150;
      soltar(cx, cy, Math.cos(ang) * v, Math.sin(ang) * v, 0.45, 1.1);
    }
    pedir();
  }, { passive: true });

  function apagar() {
    visible = false;
    estela.length = 0;
    particulas.length = 0;
    ctx.clearRect(0, 0, ancho, alto);
  }
  document.addEventListener("mouseleave", apagar);
  window.addEventListener("blur", apagar);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) apagar();
  });
  window.addEventListener("resize", medir);

  medir();
})();
  </script>
</body>
</html>

:root {
--bg: #08080c;
--surface: #111119;
--surface-2: #16161f;
--border: #23232e;
--border-strong: #30303c;
--text: #f4f4f7;
--text-2: #9a9aa6;
--text-3: #7c7c88;
--accent: #c084fc;
--grad-brand: linear-gradient(120deg, #7C3AED, #EC4899 60%, #FB6E3C);
--grad-text: linear-gradient(120deg, #2F6BFF, #7C3AED, #EC4899, #FB6E3C);
--font-head: "Space Grotesk", system-ui, sans-serif;
--font-body: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
background: var(--bg);
color: var(--text);
font-family: var(--font-body);
font-size: 16px;
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
-webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.grad-text {
background: var(--grad-text);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
}
.glow {
position: fixed;
top: -18%;
left: 50%;
transform: translateX(-50%);
width: min(1000px, 120vw);
height: 640px;
background: radial-gradient(closest-side, rgba(124, 58, 237, 0.28), rgba(47, 107, 255, 0.10), transparent);
pointer-events: none;
z-index: 0;
}
.site-header {
position: relative;
z-index: 1;
display: flex;
align-items: center;
justify-content: space-between;
width: 100%;
max-width: 1080px;
margin: 0 auto;
padding: 24px 32px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { height: 44px; width: auto; display: block; }
.brand-name {
font-family: var(--font-head);
font-weight: 700;
font-size: 26px;
line-height: 1;
letter-spacing: -0.02em;
color: #fff;
}
.site-nav { display: flex; gap: 28px; font-size: 16px; color: var(--text-2); }
.site-nav a { transition: color 0.15s ease; }
.site-nav a:hover, .site-nav a.active { color: var(--text); }
.hero {
position: relative;
z-index: 1;
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 40px 32px 90px;
}
.kicker {
font-size: 12px;
letter-spacing: 0.28em;
text-transform: uppercase;
color: var(--text-3);
margin-bottom: 24px;
}
.hero-title {
font-family: var(--font-head);
font-weight: 700;
font-size: clamp(34px, 6vw, 60px);
line-height: 1.08;
letter-spacing: -0.02em;
color: #fff;
max-width: 840px;
margin-bottom: 24px;
}
.hero-sub {
font-size: 19px;
color: var(--text-2);
max-width: 520px;
margin-bottom: 38px;
line-height: 1.6;
}
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
@keyframes fadeUp {
from { opacity: 0; transform: translateY(14px); }
to { opacity: 1; transform: none; }
}
.hero > * { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
.hero .kicker { animation-delay: 0.05s; }
.hero-title { animation-delay: 0.15s; }
.hero-sub { animation-delay: 0.28s; }
.hero-actions { animation-delay: 0.4s; }
@media (prefers-reduced-motion: reduce) {
.hero > * { opacity: 1; animation: none; }
}
.btn {
position: relative;
overflow: hidden;
display: inline-flex;
align-items: center;
gap: 6px;
font-size: 16px;
font-weight: 500;
padding: 14px 28px;
border-radius: 12px;
transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.25s ease;
}
.btn::after {
content: "";
position: absolute;
top: 0;
left: -75%;
width: 60%;
height: 100%;
background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
transform: skewX(-20deg);
pointer-events: none;
}
.btn:hover::after { animation: btn-shine 0.7s ease; }
@keyframes btn-shine {
from { left: -75%; }
to { left: 130%; }
}
.btn-primary { background: var(--grad-brand); color: #fff; }
.btn-primary:hover { box-shadow: 0 6px 30px rgba(236, 72, 153, 0.42); }
.btn-ghost { border: 1px solid var(--border-strong); color: var(--text); }
.btn-ghost:hover { border-color: #45455a; background: rgba(255, 255, 255, 0.04); }
@media (prefers-reduced-motion: reduce) {
.btn:hover::after { animation: none; }
}
.work {
position: relative;
z-index: 1;
flex: 1;
width: 100%;
max-width: 1080px;
margin: 0 auto;
padding: 32px 32px 80px;
}
.work-head { margin-bottom: 40px; }
.page-title {
font-family: var(--font-head);
font-weight: 700;
font-size: 36px;
letter-spacing: -0.02em;
color: #fff;
margin-bottom: 10px;
}
.page-sub { font-size: 16px; color: var(--text-2); max-width: 520px; }
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 22px;
}
.card {
display: flex;
flex-direction: column;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 16px;
overflow: hidden;
transition: border-color 0.18s ease, transform 0.18s ease;
}
.card:hover { border-color: var(--border-strong); transform: translateY(-4px); }
.card-image {
position: relative;
aspect-ratio: 16 / 10;
background: var(--surface-2);
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
}
.card-mono {
font-family: var(--font-head);
font-size: 42px;
font-weight: 700;
background: var(--grad-text);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
opacity: 0.9;
}
.card-image img {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.card-body { padding: 18px 20px; display: flex; flex-direction: column; flex: 1; }
.card-name {
font-family: var(--font-head);
font-size: 17px;
font-weight: 500;
color: #fff;
margin-bottom: 7px;
}
.card-desc { font-size: 14px; color: var(--text-2); line-height: 1.55; margin-bottom: 16px; flex: 1; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-open { font-size: 13px; font-weight: 500; color: var(--accent); }
.card-platform { display: inline-flex; color: var(--text-3); }
.card-platform svg { width: 18px; height: 18px; display: block; }
.card:hover .card-platform { color: var(--text-2); }
.reveal-card { opacity: 0; transform: translateY(18px); }
.reveal-card.in { opacity: 1; transform: none; transition: opacity 0.5s ease, transform 0.5s ease; }
.site-footer {
position: relative;
z-index: 1;
text-align: center;
padding: 32px;
color: var(--text-3);
}
.socials {
display: flex;
gap: 20px;
justify-content: center;
flex-wrap: wrap;
margin-bottom: 18px;
}
.socials a {
display: inline-flex;
color: var(--text-3);
transition: color 0.15s ease, transform 0.15s ease;
}
.socials a:hover { color: var(--text); transform: translateY(-2px); }
.socials svg { width: 20px; height: 20px; display: block; }
.copyright { font-size: 13px; }
@media (max-width: 560px) {
.site-header { padding: 20px; }
.site-nav { gap: 18px; }
.hero { padding: 24px 20px 70px; }
.work { padding: 24px 20px 64px; }
}
.card-image img.fit-contain {
object-fit: contain;
padding: 2%;
background: #000;
}
